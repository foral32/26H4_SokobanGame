<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>箱即是空 · 玩家造关界面</title><link rel="stylesheet" href="player-editor.css"></head>
<body>
<header class="review-strip"><span>玩家造关 · 交互设计稿</span><nav aria-label="设计稿导航"><button data-preview="edit" class="current">摆一摆</button><button data-preview="stack">拆开看</button><button data-preview="library">我的关卡</button><button data-preview="resize">棋盘大小</button><button data-preview="notes">设计说明</button></nav><small>界面样机 · 尚未接入 Unity</small></header>
<div id="viewport"><main id="game" class="game">
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<section id="edit" class="screen active" aria-label="制作关卡">
 <header class="game-heading"><button class="round-control" data-action="back-library" aria-label="返回我的关卡"><span class="round" data-glyph="back"></span><span>返回</span></button><div class="heading-copy"><div class="mode-name">造一关</div><button class="level-title" data-action="rename" title="给关卡取名"><span id="level-name">交错</span><svg class="glyph mini"><use href="#i-pencil"/></svg></button></div></header>
 <div class="top-actions"><span id="save-state" class="save-state">草稿</span><button class="round-control" data-action="more"><span class="round" data-glyph="dots"></span><span>更多</span></button><button class="round-control play-now" data-action="play"><span class="round" data-glyph="play"></span><span>玩一下</span></button></div>
 <div class="tool-rail" aria-label="常用工具"><button class="round-control selected" data-tool="place"><span class="round" data-glyph="hand"></span><span>摆放</span></button><button class="round-control" data-tool="look"><span class="round" data-glyph="eye"></span><span>查看</span></button><button class="round-control" data-tool="erase"><span class="round" data-glyph="erase"></span><span>擦除</span></button></div>
 <div id="board-space" class="board-space"><div id="board" class="board" role="group" aria-label="关卡棋盘"></div><div id="hover-object" class="hover-object" aria-hidden="true"></div></div>
 <aside id="stack-popover" class="stack-popover" aria-label="查看这一格" hidden><button class="close-small" data-action="close-stack" aria-label="收起这一格">×</button><h2>这一格里</h2><p class="stack-intro">点一下，选中你想改的那一个</p><div id="stack-objects" class="stack-objects"></div><div id="stack-base" class="stack-base"></div><div class="stack-actions"><button class="game-button small" data-action="lift">放到上面</button><button class="game-button small" data-action="remove-layer">拿走</button></div><p class="stack-note" id="stack-note">选中内容只会高亮，不会移动。</p></aside>
 <div class="making-hint" id="making-hint"><strong>拿起白箱子</strong><span>点一下放下，按住连续摆放</span></div>
 <div class="object-dock"><div class="color-picker"><span>颜色</span><div><button class="white chosen" data-tone="1" aria-label="白色物件"></button><button class="black" data-tone="2" aria-label="黑色物件"></button></div></div><div class="palette" id="palette" aria-label="拿起一个物件"></div><button class="round-control more-tools" data-action="tools"><span class="round" data-glyph="tools"></span><span>工具</span></button></div>
 <div class="history"><button class="round-control" data-action="undo" id="undo"><span class="round" data-glyph="undo"></span><span>撤回</span></button><button class="round-control" data-action="redo" id="redo"><span class="round" data-glyph="redo"></span><span>重做</span></button></div>
 <button class="hint-button" data-action="help"><span class="keycap">?</span> 怎么做</button><div class="view-controls"><button data-action="view" id="view-label" title="只改变观看方式，不改变物件颜色">白色视角 <svg class="glyph mini"><use href="#i-switch"/></svg></button><button data-action="grid" id="grid-toggle">网格</button><button data-action="fit">适配</button></div>
</section>
<section id="library" class="screen" aria-label="我的关卡">
 <header class="library-heading"><h1>我的关卡</h1><p>从一个小想法开始</p></header><div class="library-cards" id="library-cards"></div><div class="library-selection"><h2 id="selected-name">交错</h2><p id="selected-description">还在制作</p></div><div class="library-actions"><button class="game-button prominent" data-action="continue">继续制作 <svg class="glyph"><use href="#i-pencil"/></svg></button><button class="game-button secondary" data-action="level-options">关卡选项</button></div><div class="library-utilities"><button class="round-control" data-action="import"><span class="round" data-glyph="import"></span><span>导入关卡</span></button><button class="round-control" data-action="help"><span class="round" data-glyph="help"></span><span>帮助</span></button></div><p class="game-footer">← → 选择　　空格 继续　　<span>也可以直接点击方块</span></p>
</section>
<section id="play" class="screen" aria-label="试玩界面"><header class="game-heading"><div class="heading-copy"><div class="mode-name" id="play-name">交错</div><p>试试看</p></div></header><button class="round-control return-making" data-action="return-edit"><span class="round" data-glyph="pencil"></span><span>继续制作</span></button><div class="play-board-space"><div id="play-board" class="board play-board"></div></div><p class="game-footer">方向键 移动　　空格 切换　　Z 撤回　　R 重置</p></section>
<div id="popup-shade" class="popup-shade" hidden><section id="popup" class="popup" role="dialog" aria-modal="true"></section></div><div class="toast" id="toast" role="status"></div><svg class="iris" id="iris" width="1280" height="720" aria-hidden="true"><circle id="iris-circle" cx="640" cy="360"/></svg>
</main></div>
<svg class="definitions" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-back" viewBox="0 0 32 32"><path d="m17 7-10 9 10 9M7 16h20"/></symbol><symbol id="i-play" viewBox="0 0 32 32"><path d="M10 5v22l18-11Z"/></symbol><symbol id="i-pencil" viewBox="0 0 32 32"><path d="m8 20 14-14 5 5-14 14-7 2Zm11-11 5 5"/></symbol><symbol id="i-hand" viewBox="0 0 32 32"><path d="M11 18V7c0-4 5-4 5 0v8-3c0-3 4-3 4 0v4-2c0-3 4-3 4 0v4-1c0-3 4-3 4 0v5c0 7-13 8-16 4L5 18c-2-3 2-6 4-3l2 3"/></symbol><symbol id="i-eye" viewBox="0 0 32 32"><path d="M3 16s5-9 13-9 13 9 13 9-5 9-13 9S3 16 3 16Z"/><circle cx="16" cy="16" r="4"/></symbol><symbol id="i-erase" viewBox="0 0 32 32"><path d="m4 19 15-15 10 10-13 13H12Zm6-6 10 10M15 27h14"/></symbol><symbol id="i-undo" viewBox="0 0 32 32"><path d="m11 6-7 7 7 7M4 13h13c14 0 14 15 0 15"/></symbol><symbol id="i-redo" viewBox="0 0 32 32"><path d="m21 6 7 7-7 7m7-7H15C1 13 1 28 15 28"/></symbol><symbol id="i-dots" viewBox="0 0 32 32"><path d="M7 16h.1M16 16h.1M25 16h.1" style="stroke-width:5"/></symbol><symbol id="i-tools" viewBox="0 0 32 32"><path d="M5 6h9v9H5Zm15 0h9v9h-9ZM5 21h9v9H5Zm15 0h9v9h-9Z"/></symbol><symbol id="i-switch" viewBox="0 0 32 32"><path d="M4 11h23l-6-6M28 21H5l6 6"/></symbol><symbol id="i-import" viewBox="0 0 32 32"><path d="M16 3v17m-7-7 7 7 7-7M5 21v8h22v-8"/></symbol><symbol id="i-help" viewBox="0 0 32 32"><path d="M10 10c0-9 15-9 13 0-1 5-7 4-7 10m0 7v.1"/></symbol><symbol id="i-line" viewBox="0 0 32 32"><path d="M5 27 27 5M3 24l5 5M24 3l5 5"/></symbol><symbol id="i-rect" viewBox="0 0 32 32"><path d="M5 6h23v21H5Z"/></symbol><symbol id="i-fill" viewBox="0 0 32 32"><path d="m6 18 13-13 11 11-13 13ZM3 7l15 15M7 25c-5 5-7 5-7 1 0-2 4-5 4-5"/></symbol><symbol id="i-select" viewBox="0 0 32 32"><path stroke-dasharray="4 4" d="M4 4h24v24H4Z"/><path d="m12 12 10 7-5 1-2 5Z"/></symbol><symbol id="i-copy" viewBox="0 0 32 32"><path d="M11 11h17v18H11ZM5 22H3V3h19v2"/></symbol><symbol id="i-save" viewBox="0 0 32 32"><path d="M5 4h19l4 4v21H5ZM10 4v10h12V4M10 29V19h13v10"/></symbol><symbol id="i-resize" viewBox="0 0 32 32"><path d="M18 5h10v10M28 5 17 16M14 28H4V18M4 28l10-10"/></symbol><symbol id="i-plus" viewBox="0 0 32 32"><path d="M16 4v24M4 16h24"/></symbol></defs></svg>
<script src="review-assets.js"></script><script src="player-editor.js"></script></body></html>
